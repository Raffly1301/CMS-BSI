<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BSI Chiller Management System</title>
  <meta name="theme-color" content="#c01e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BSI CMS">
  <link rel="icon" type="image/png" href="/BSI PWA.png">
  <link rel="apple-touch-icon" href="/BSI PWA.png">
  <link rel="manifest" href="/manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">

  <!-- PDF & Excel Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    .font-brand {
      font-family: 'Lora', serif;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(15%) sepia(95%) saturate(6932%) hue-rotate(358deg) brightness(95%) contrast(112%);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #d1d5db;
    }

    @media print {

      aside,
      nav,
      button,
      header .flex-items-center,
      .action-buttons,
      .mobile-nav {
        display: none !important;
      }

      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      main {
        padding: 0 !important;
        margin: 0 !important;
      }

      table {
        font-size: 10pt !important;
        width: 100% !important;
      }
    }
  </style>

    "react-dom": "https://esm.sh/react-dom@^19.2.4",

  }
}
</script>
</head>
